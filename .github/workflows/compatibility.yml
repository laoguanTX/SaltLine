name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / system Python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install desktop schema and Python bindings for isolated tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi cinnamon-common
      - name: Build and test (no live desktop settings are modified)
        run: /usr/bin/python3 scripts/test.py
